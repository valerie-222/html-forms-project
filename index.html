<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team 16 - Explore Forms</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #ff702a;
      --secondary-color: #ffc107;
      --background-color: #8b0000;
      --white: #ffffff;
      --text-color: #fff;
      --card-bg: #ffdd57;
      --card-hover: #fff3cd;
      --transition: all 0.3s ease-in-out;
      --font-header: "Poppins", sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--background-color);
      background-image: url('8.png'); /* Update with your own image */
      font-family: var(--font-header);
      color: var(--text-color);
    }

    .header {
      text-align: center;
      padding: 2rem;
    }

    .header h1 {
      font-size: 2rem;
      color: var(--white);
    }

    .header p {
      font-size: 1.2rem;
      margin-top: 0.5rem;
    }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      position: relative;
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      color: white;
      text-decoration: none;
      overflow: hidden;
      height: 250px;
      background-size: cover;
      background-position: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: transform 0.3s ease-in-out;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.5); /* Overlay to make text more readable */
      z-index: 0;
    }

    .card h4,
    .card p {
      position: relative;
      z-index: 1;
    }

    .card:hover {
      transform: translateY(-5px);
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>CHOOSE A FORM TO FILL OUT</h1>
    <p>Select one of the available surveys to begin.</p>
  </header>

  <section class="cards-container">
    <a href="disaster-preparedness.html" class="card" style="background-image: url('disaster.jpg');">
      <h4>Disaster Preparedness Form</h4>
      <p>Help us understand your readiness for emergencies.</p>
    </a>
    <a href="School-Classroom-Feedback.html" class="card" style="background-image: url('classroom.jpg');">
      <h4>Classroom Survey Feedback</h4>
      <p>Share your feedback on learning experiences.</p>
    </a>
    <a href="local-tourism.html" class="card" style="background-image: url('tourism.jpg');">
      <h4>Local Tourism Survey</h4>
      <p>Contribute to improving our community's tourism.</p>
    </a>
  </section>
</body>
</html>
