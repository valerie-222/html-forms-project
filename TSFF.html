<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visitor Information - LakbayTinig</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="tourism-feedback-system">
    <section class="visitor-info-section" id="visitor-info">
      <header class="header-section">
        <h1>Visitor Information</h1>
        <p>Please provide your personal details to proceed.</p>
      </header>

      <div class="form-box">
        <form id="visitor-form">
          <label for="full-name">Full Name:</label>
          <input type="text" id="full-name" name="full-name" placeholder="Enter your Full Name" required />

          <label for="age">Enter Your Age:</label>
             <input type="text" id="age" name="age" placeholder="Enter your Age" required />

          
          
          <label for="visitor-type">Select Visitor Type:</label>
          <select id="visitor-type" name="visitor-type" required>
            <option value="" disabled selected>-- Please Select --</option>
            <option value="researcher">Researcher</option>
            <option value="local">Local Resident</option>
            <option value="student">Student</option>
            <option value="volunteer">Volunteer</option>
            <option value="media">Media/Press</option>
          </select>

          <label for="nationality">Nationality:</label>
             <input type="text" id="nationality" name="nationality" placeholder="Enter your nationality" required /> 

          <button type="button" class="btn" onclick="validateForm()">Next</button>
        </form>
      </div>
    </section>
  </main>

  <script>
    function validateForm() {
      const form = document.getElementById('visitor-form');
      if (form.checkValidity()) {
        window.location.href = 'date.html';
      } else {
        alert('Please complete all required fields before proceeding.');
      }
    }
  </script>

  
</body>
</html>
