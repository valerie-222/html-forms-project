<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summary Feedback - LakbayTinig</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .summary-container {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      width: 80%;
      margin: auto;
    }
    
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #f2f2f2;
      color: #34495e;
    }
    .back-btn {
      display: block;
      width: 150px;
      margin: 30px auto;
      padding: 10px 0;
      text-align: center;
      background-color: #00796b;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
    .back-btn:hover {
      background-color: #004d40;
    }
  </style>
</head>
<body>

  <div class="summary-container">
    <h1>Feedback Summary</h1>

    <table>
      <tr>
        <th>Field</th>
        <th>Response</th>
      </tr>
      <tr>
        <td><strong>Full Name</strong></td>
        <td id="summary-name">Loading...</td>
      </tr>
      <tr>
        <td><strong>Age</strong></td>
        <td id="summary-age">Loading...</td>
      </tr>
      <tr>
        <td><strong>Visitor Type</strong></td>
        <td id="summary-visitor-type">Loading...</td>
      </tr>
      <tr>
        <td><strong>Nationality</strong></td>
        <td id="summary-nationality">Loading...</td>
      </tr>
      
    </table>

    <a href="index.html" class="back-btn">Back to homepage</a>
  </div>

  <script>
    window.onload = function() {
      const formData = JSON.parse(localStorage.getItem('visitorData')) || {};

      document.getElementById('summary-name').textContent = formData.fullName || 'Not Provided';
      document.getElementById('summary-age').textContent = formData.age || 'Not Provided';
      document.getElementById('summary-visitor-type').textContent = formData.visitorType || 'Not Provided';
      document.getElementById('summary-nationality').textContent = formData.nationality || 'Not Provided';

    };
  </script>

</body>
</html>
