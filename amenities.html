<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LakbayTinig</title>
  <link rel="stylesheet" href="styles.css" />

  
</head>
<body>
  <main class="tourism-feedback-system">
    <section class="feedback-form-section" id="feedback-form-section">
     
      <div class="form-box">
        <form id="feedback-form" onsubmit="redirectToNext(event)">
          <fieldset>
            <legend>Spot Information</legend>
            <label for="spot">Tourist Spot Visited:</label>
            <input type="text" id="spot" name="spot" placeholder="e.g., Kawasan Falls, Cebu" required />
          </fieldset>

          <fieldset>
            <legend>Safety and Costs</legend>
            <label for="safety">Did you feel safe during your visit?</label>
            <select id="safety" name="safety" required>
              <option value="" disabled selected>-- Please Select --</option>
              <option value="Yes">Yes</option>
              <option value="Somewhat">Somewhat</option>
              <option value="No">No</option>
            </select>

            <label for="value">Were there enough amenities (e.g., restrooms, seating, water stations) to accommodate the number of visitors?</label>
            <select id="value" name="value" required>
              <option value="" disabled selected>-- Please Select --</option>
              <option value="Absolutely">Absolutely</option>
              <option value="Mostly">Mostly</option>
              <option value="Neutral">Neutral </option>
              <option value="Somewhat insufficient">Somewhat insufficient </option>
              <option value="Insufficiente">Insufficient </option>

            </select>
          </fieldset>

          <fieldset>
            <legend>Environmental Maintenance</legend>
            <label for="environment">Was the area clean and well-maintained?</label>
            <select id="environment" name="environment" required>
              <option value="" disabled selected>-- Please Select --</option>
              <option value="Yes">Yes</option>
              <option value="Somewhat">Somewhat</option>
              <option value="No">No</option>
            </select>
          </fieldset>

          <button type="submit" class="btn">Next</button>
        </form>
      </div>
    </section>
  </main>

  <script>
    function redirectToNext(event) {
      event.preventDefault(); 
      const form = document.getElementById("feedback-form");

      if (form.checkValidity()) {
        window.location.href = "next.html"; 
      } else {
        form.reportValidity();
      }
    }
  </script>

</body>
</html>
