<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You - LakbayTinig</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: auto;
      background-image: url(images/green.png);
    }

    main.thank-you-page {
      text-align: center;
      background-color: white;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
      
    }

    header.thank-you {
      background-color: white;
      color: black;
      padding: 20px;
      border-radius: 5px;
      margin-bottom: 20px;
    }

    header.thank-you h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    header.thank-you p {
      font-size: 1.2rem;
    }

    .thank-you-btn {
      background-color: #00796b;
      color: white;
      padding: 12px 25px;
      text-decoration: none;
      border-radius: 5px;
      font-size: 18px;
      transition: background-color 0.3s ease;
      display: inline-block;
      margin-top: 20px;
    }

    .thank-you-btn:hover {
      background-color: #004d40;
    }

    .footer-section {
      border-top: 1px solid #ddd;
      padding: 2rem 1rem;
      font-size: 0.9rem;
      color: #555;
      margin-top: 3rem;
    }

    .footer-content {
      text-align: center;
    }

    .footer-content p {
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>

<main class="thank-you-page">
  <header class="thank-you">
    <h1>Thank you for your feedback!</h1>
    <p>Your response has been submitted successfully.</p>
  </header>

  <a href="reponses.html" class="thank-you-btn">Responses</a>


  <footer class="footer-section">
    <section class="footer-content">
      <p>&copy; 2025 <strong>LakbayTinig</strong>. All rights reserved.</p>
    </section>
  </footer>
</main>

</body>
</html>
