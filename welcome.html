<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You - LakbayTinig</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ------------ Thank You Page Styles ------------ */

/* Header Section (Thank You Page) */
header.thank-you {
  background-color: #28a745;
  color: white;
  padding: 40px;
  text-align: center;
  border-bottom: 5px solid #218838;
}

header.thank-you h1 {
  font-size: 2.5rem;
  margin-bottom: 10px;
}

header.thank-you p {
  font-size: 1.2rem;
  margin-bottom: 20px;
}

/* Thank You Page Button */
.thank-you-btn {
  background-color: #007bff;
  color: white;
  padding: 12px 25px;
  text-decoration: none;
  border-radius: 5px;
  font-size: 18px;
  transition: background-color 0.3s ease;
}

.thank-you-btn:hover {
  background-color: #0056b3;
}


.footer-section {
  border-top: 1px solid #ddd;
  text-align: center;
  padding: 2rem 1rem;
  margin-top: 4rem;
  font-size: 0.9rem;
  color: #555;
}

.footer-content {
  max-width: 1200px;
  margin: 0 auto;
}

.footer-nav {
  list-style: none;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 1.5rem;
  padding: 0;
  margin: 1.5rem 0;
}

.footer-nav li {
  display: inline;
}

.footer-nav a {
  color: #0077cc;
  text-decoration: none;
  font-weight: 500;
}

.footer-nav a:hover,
.footer-nav a:focus {
  text-decoration: underline;
}

.footer-tagline {
  font-style: italic;
  color: #777;
  margin-top: 1rem;
}

.footer-content p {
  margin: 0.5rem 0;
}


    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border: 1px solid #ddd;
    }
    th {
      background-color: #f2f2f2;
    }
    h1 {
      text-align: center;
      margin-top: 50px;
    }
  </style>
</head>
<body>

<main class="thank-you-page">
  <header>
    <h1>Thank you for your feedback!</h1>
    <p>Your response has been submitted successfully. Here is the summary of your feedback:</p>
  </header>

  <section aria-labelledby="feedback-summary">
    <article id="feedback-summary">
      <h2>Feedback Summary</h2>
      <table id="summary-table">
        <thead>
          <tr>
            <th>Field</th>
            <th>Response</th>
          </tr>
        </thead>
        <tbody>
          <!-- The summary will be populated here using JavaScript -->
        </tbody>
      </table>
    </article>
  </section>

  <footer class="footer-section">
    <section class="footer-content">
      <p>&copy; 2025 <strong>LakbayTinig</strong>. All rights reserved.</p>
    </section>
  </footer>
</main>

<script>
    const feedbackData = JSON.parse(localStorage.getItem('feedbackData'));
    const allFeedbacks = JSON.parse(localStorage.getItem('allFeedbacks')) || [];
  
    // Display individual summary
    if (feedbackData) {
      const summaryTable = document.getElementById('summary-table').getElementsByTagName('tbody')[0];
  
      for (const key in feedbackData) {
        if (feedbackData.hasOwnProperty(key)) {
          const row = summaryTable.insertRow();
          const cell1 = row.insertCell(0);
          const cell2 = row.insertCell(1);
          const label = key.replace(/([A-Z])/g, ' $1').toUpperCase();
          cell1.textContent = label;
          cell2.textContent = key === "overall" ? "★".repeat(feedbackData[key]) + ` (${feedbackData[key]})` : feedbackData[key];
        }
      }
    } else {
      alert('No feedback data found.');
    }
  
    // Display full survey result table
    const fullTableContainer = document.createElement('section');
    fullTableContainer.innerHTML = `
      <h2 style="margin-top:2rem;">All Survey Results</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Rating</th>
            <th>Favorite Activities/Spots</th>
            <th>Suggestions</th>
          </tr>
        </thead>
        <tbody id="all-results-body"></tbody>
      </table>
    `;
  
    document.body.appendChild(fullTableContainer);
  
    const resultsBody = document.getElementById("all-results-body");
    allFeedbacks.forEach((entry, index) => {
      const row = resultsBody.insertRow();
      row.insertCell(0).textContent = index + 1;
      row.insertCell(1).textContent = "★".repeat(entry.overall) + ` (${entry.overall})`;
      row.insertCell(2).textContent = entry.activities || "N/A";
      row.insertCell(3).textContent = entry.improve || "N/A";
    });
  </script>
  

</body>
</html>
